name: FastAPI Calculator CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run unit and API tests
        run: |
          python -m pytest tests/unit tests/integration -v

      - name: Start the web application and run browser tests
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8000/
          python -m pytest tests/e2e -v